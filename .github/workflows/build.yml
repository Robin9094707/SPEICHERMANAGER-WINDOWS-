name: Build Simplex Speichermanager

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, inkl. Windows App SDK)
        shell: pwsh
        run: |
          $plat = if ('${{ matrix.arch }}' -eq 'arm64') { 'ARM64' } else { 'x64' }
          dotnet publish src/SimplexSpeichermanager/SimplexSpeichermanager.csproj `
            -c Release `
            -r win-${{ matrix.arch }} `
            -p:Platform=$plat `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:DebugType=None `
            -o publish/SimplexSpeichermanager

      - name: Ausgabe prüfen
        shell: pwsh
        run: |
          if (-not (Test-Path publish/SimplexSpeichermanager/SimplexSpeichermanager.exe)) { throw "EXE fehlt" }
          if (-not (Test-Path publish/SimplexSpeichermanager/Microsoft.WindowsAppRuntime.dll)) { throw "Windows App Runtime fehlt" }
          Get-ChildItem publish/SimplexSpeichermanager -Filter *.pri | Select-Object Name, Length
          $size = (Get-ChildItem publish/SimplexSpeichermanager -Recurse | Measure-Object Length -Sum).Sum / 1MB
          "Paketgröße: {0:N1} MB" -f $size

      - name: Selbsttest (App starten, alle Seiten öffnen)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'SimplexSpeichermanager\log.txt'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process publish/SimplexSpeichermanager/SimplexSpeichermanager.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Selbsttest hängt" }
          if (-not (Test-Path $log)) { throw "Kein Log – App ist vermutlich abgestürzt (ExitCode $($p.ExitCode))" }
          $content = Get-Content $log -Raw
          $content
          if ($content -notmatch 'SELFTEST ENDE') { throw "Selbsttest nicht vollständig (ExitCode $($p.ExitCode))" }
          if ($content -match 'Unbehandelte|FEHLER|Fatal') { throw "Fehler im Selbsttest" }
          "Selbsttest erfolgreich"

      - name: ZIP erstellen
        shell: pwsh
        run: Compress-Archive -Path publish/SimplexSpeichermanager -DestinationPath SimplexSpeichermanager-win-${{ matrix.arch }}.zip

      - name: Installer bauen (Inno Setup)
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup nicht gefunden" }
          [xml]$proj = Get-Content src/SimplexSpeichermanager/SimplexSpeichermanager.csproj
          $version = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          $src = (Resolve-Path publish/SimplexSpeichermanager).Path
          & $iscc /Qp "/DAppVersion=$version" "/DArch=${{ matrix.arch }}" "/DSourceDir=$src" installer/SimplexSpeichermanager.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC fehlgeschlagen ($LASTEXITCODE)" }
          Get-ChildItem setup | Select-Object Name, Length

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SimplexSpeichermanager-win-${{ matrix.arch }}
          path: publish/SimplexSpeichermanager
          retention-days: 30

      - name: Installer hochladen
        uses: actions/upload-artifact@v4
        with:
          name: SimplexSpeichermanager-Setup-win-${{ matrix.arch }}
          path: setup/*.exe
          retention-days: 30

      - name: Release-Datei hochladen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SimplexSpeichermanager-win-${{ matrix.arch }}.zip
            setup/*.exe
          generate_release_notes: true
